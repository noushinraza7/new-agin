services:
  web:
    build: .
    container_name: php-login-app
    ports:
      - "8082:80"
    environment:
      DB_HOST: db
      DB_NAME: php_login
      DB_USER: appuser
      DB_PASS: ${DB_PASSWORD:-training-password}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: mysql:8.4
    container_name: php-login-db
    environment:
      MYSQL_DATABASE: php_login
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-training-password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-training-password}
    ports:
      - "3332:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    restart: unless-stopped

volumes:
  mysql_data: